<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SC Aura ERP — Offline</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
      .card { max-width: 420px; }
      h1 { font-size: 22px; margin: 12px 0 8px; letter-spacing: -0.01em; }
      p  { color: #6b7280; font-size: 14px; line-height: 1.55; }
      .btn { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 999px; background: #111827; color: #fff; text-decoration: none; font-weight: 600; letter-spacing: 0.02em; font-size: 13px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #dc2626; display: inline-block; margin-right: 6px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div style="font-size:11px; letter-spacing:0.28em; color:#6b7280; text-transform:uppercase;"><span class="dot"></span>Offline</div>
        <h1>SC Aura Kurtis</h1>
        <p>You are offline. Reconnect to continue managing inventory, bookings and dispatch.</p>
        <a class="btn" href="/">Try again</a>
      </div>
    </div>
  </body>
</html>
